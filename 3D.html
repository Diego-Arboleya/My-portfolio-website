<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>D.A.M – Shaders</title>
  <link href="https://fonts.googleapis.com/css2?family=Italiana&family=Josefin+Sans:wght@600;900&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --teal:  #1a757b;
      --orange:  #d44926;
      --gold:  #f4b324;
      --green: #179267;
      --dark:  #1c191a;
      --text:  #f6e7d8;
      --nav-h: 72px;
      --gap:   clamp(16px, 3vw, 40px);
    }

    html, body { height: 100%; scroll-behavior: smooth; }
    body { background: var(--dark); color: var(--text); font-family: 'Josefin Sans', Helvetica, sans-serif; overflow-x: hidden; }

    .title-font { font-family: 'Italiana', Georgia, serif; }

    /* ─── HEADER ─── */
    header { position: fixed; top: 0; left: 0; right: 0; z-index: 300; background: var(--text); height: var(--nav-h); }
    .header-inner { height: var(--nav-h); padding: 0 var(--gap); display: flex; align-items: center; justify-content: space-between; }
    nav ul { list-style: none; display: flex; gap: clamp(1rem, 2.5vw, 2.2rem); }
    .logo { font-family: 'Italiana', Georgia, serif; font-weight: 600; font-size: 2.85rem; color: var(--dark); letter-spacing: 0.04em; text-decoration: none; }
    nav a { color: var(--orange); text-decoration: none; font-family: 'Josefin Sans', Helvetica, sans-serif; font-size: clamp(0.75rem, 1vw, 0.95rem); font-weight: 900; letter-spacing: 0.14em; text-transform: uppercase; transition: opacity 0.2s; text-shadow: 0.3px 0 0 currentColor, -0.3px 0 0 currentColor;}
    nav a:hover { opacity: 0.7; }

    /* Hamburger */
    .hamburger { display: none; flex-direction: column; gap: 5px; cursor: pointer; background: none; border: none; padding: 4px; }
    .hamburger span { display: block; width: 24px; height: 2px; background: var(--orange); border-radius: 2px; transition: transform 0.3s, opacity 0.3s; }
    .hamburger.open span:nth-child(1) { transform: translateY(7px) rotate(45deg); }
    .hamburger.open span:nth-child(2) { opacity: 0; }
    .hamburger.open span:nth-child(3) { transform: translateY(-7px) rotate(-45deg); }
    .mobile-menu { display: none; position: fixed; top: var(--nav-h); left: 0; right: 0; z-index: 299; background: var(--text); padding: 0.8rem var(--gap) 1.2rem; flex-direction: column; gap: 1rem; }
    .mobile-menu.open { display: flex; }
    .mobile-menu a { color: var(--orange); text-decoration: none; font-family: 'Josefin Sans', Helvetica, sans-serif; font-size: 0.9rem; font-weight: 900; letter-spacing: 0.12em; text-transform: uppercase; }

    /* ─── PAGE BODY ─── */
    .page-body { padding-top: var(--nav-h); }

    /* ─── MAIN WRAPPER ─── */
    .main-wrapper { padding: var(--gap); padding-top: clamp(12px, 2vw, 24px); overflow-x: hidden; position: relative; }

    /* ─── CARD ─── */
    .card { border: 2px solid var(--gold); background: var(--dark); padding: clamp(28px, 4vw, 60px) clamp(24px, 5vw, 64px); position: relative; z-index: 2; }

    /* ─── ACCENT BAR RIGHT ─── */
    #accentRight { position: absolute; right: calc(-1 * var(--gap)); width: clamp(150px, 27vw, 360px); height: clamp(22px, 2.8vw, 36px); background: var(--orange); z-index: 3; }

    /* ─── PAGE TITLE ─── */
    .page-title { font-family: 'Italiana', Georgia, serif; font-size: clamp(3rem, 8vw, 6rem); color: var(--text); line-height: 1; margin-bottom: 2.4rem; font-weight: 400; }

    /* ─── SHADER ENTRY ─── */
    .shader-entry { margin-bottom: 3.5rem; }
    .shader-entry:last-child { margin-bottom: 0; }

    .entry-title { font-family: 'Italiana', Georgia, serif; font-size: clamp(1.25rem, 2.5vw, 1.7rem); color: var(--text); text-decoration: underline; text-underline-offset: 5px; margin-bottom: 1rem; display: block; font-weight: 400; line-height: 1.3; }

    .entry-desc { font-size: clamp(1.05rem, 1.8vw, 1.28rem); font-weight: 700; line-height: 1.75; color: var(--text); margin-right:0.1% ; margin-bottom: 1.6rem; }

    /* ─── THUMBNAIL LINK ─── */
    .thumb-link { display: block; text-decoration: none; }
    .thumb-placeholder { width: 100%; aspect-ratio: 16/9; background: var(--teal); opacity: 0.35; border-radius: 2px; transition: opacity 0.2s; }
    .thumb-link:hover .thumb-placeholder { opacity: 0.55; }

    /* ─── DIAGONAL TRIANGLE ─── */
    #diagTriangle { position: absolute; top: 0; right: 0; width: clamp(100px, 16vw, 240px); height: auto; z-index: 4; pointer-events: none; display: block;transform: rotate(-90deg); }

    /* ─── FOOTER ─── */
    footer { background: var(--text); padding: 1rem var(--gap); text-align: center; position: relative; z-index: 2; }
    footer p { font-family: 'Josefin Sans', Helvetica, sans-serif; font-size: 0.75rem; font-weight: 700; color: var(--dark); line-height: 1.75; }
    footer a { color: var(--dark); text-decoration: underline; }

    .thumb-link { position: relative; display: block; text-decoration: none; }
    .thumb-link img { width: 100%; aspect-ratio: 16/9; object-fit: cover; display: block; border-radius: 2px; transition: opacity 0.2s; }
    .thumb-link:hover img { opacity: 0.75; }
    .thumb-overlay {
      position: absolute; inset: 0;
      display: flex; align-items: center; justify-content: center;
      pointer-events: none;
    }
    .thumb-overlay span {
      font-family: 'Josefin Sans', Helvetica, sans-serif;
      font-size: clamp(1.1rem, 2.5vw, 1.8rem);
      font-weight: 900; letter-spacing: 0.18em; text-transform: uppercase;
      color: var(--text);
      background: rgba(28, 25, 26, 0.55);
      padding: 0.45em 1.1em;

      border-radius: 3px;
      transition: background 0.2s;
    }
    .thumb-link:hover .thumb-overlay span { background: rgba(28, 25, 26, 0.55); }
    @media (max-width: 700px) { nav { display: none; } .hamburger { display: flex; } }
  </style>
</head>
<body>

<header>
  <div class="header-inner">
    <a href="index.html" class="logo">D.A.M</a>
    
    <nav><ul>
      <li><a href="environment.html">Environment art</a></li>
      <li><a href="index.html">Home</a></li>
    </ul>
    </nav>
    <button class="hamburger" id="hamburger" aria-label="Toggle menu"><span></span><span></span><span></span></button>
  </div>
</header>

<div class="mobile-menu" id="mobileMenu">
  <a href="environment.html">Environment Art</a>
  <a href="dam_portfolio.html">Home</a>
</div>

<div class="page-body">
  <div class="main-wrapper" id="mainWrapper">

    <!--<div id="accentRight"></div>-->

    <div class="card" id="card">

      <h1 class="page-title">3D ART</h1>

      <div class="shader-entry">
        <a href="#" class="entry-title">Props</a>
        <p class="entry-desc">Fully optimized &amp; game ready.</p>
        <a href="3D_props.html" class="thumb-link"><img src="thumbnails/thumbnail_props3D.png" alt="Props link" /><div class="thumb-overlay"><span>Click here</span></div></a>
      </div>

      <div class="shader-entry">
        <a href="#" class="entry-title">Materials</a>
        <p class="entry-desc"></p>
        <a href="3D_materials.html" class="thumb-link"><img src="thumbnails/thumbnail_materials.png" alt="materials link" /><div class="thumb-overlay"><span>Click here</span></div></a>
      </div>

    </div>

    <img id="diagTriangle" src="lower_triangle.png" alt="" aria-hidden="true" />

  </div>

  <footer>
    <p>Unless otherwise stated, the content on this site is the property of Diego Arboleya.</p>
    <p>For any inquiries email <a href="mailto:&#100;&#46;&#97;&#114;&#98;&#111;&#108;&#101;&#121;&#97;&#46;&#109;&#64;&#103;&#109;&#97;&#105;&#108;&#46;&#99;&#111;&#109;">&#100;&#46;&#97;&#114;&#98;&#111;&#108;&#101;&#121;&#97;&#46;&#109;&#64;&#103;&#109;&#97;&#105;&#108;&#46;&#99;&#111;&#109;</a></p>
  </footer>
</div>

<script>
  const hBtn  = document.getElementById('hamburger');
  const hMenu = document.getElementById('mobileMenu');
  hBtn.addEventListener('click', () => { hBtn.classList.toggle('open'); hMenu.classList.toggle('open'); });

  const accentR = document.getElementById('accentRight');
  const wrapper = document.getElementById('mainWrapper');

  function updatePositions() {
    const wRect   = wrapper.getBoundingClientRect();
    const titleEl = document.querySelector('.page-title');
    const tRect   = titleEl.getBoundingClientRect();
    accentR.style.top    = (tRect.top - wRect.top) + 'px';
    accentR.style.height = tRect.height * 0.18 + 'px';
  }

  window.addEventListener('load',   updatePositions);
  window.addEventListener('resize', updatePositions);
  window.addEventListener('scroll', updatePositions, { passive: true });
</script>

</body>
</html>
